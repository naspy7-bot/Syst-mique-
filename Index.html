          { q: "Le père symbolique est nécessairement le père biologique de l'enfant.", answer: false, exp: "Faux. Le père symbolique représente 'l'autre que la mère' — une fonction tierce qui coupe la fusion mère-enfant. Ce peut être le beau-père, le père adoptif, etc." },
          { q: "Selon Gaillard, les comportements des 'enfants mutants' sont des troubles ou déviances à traiter.", answer: false, exp: "Faux. Gaillard propose que ces jeunes sont adaptés à un nouveau contexte social. Ce sont les institutions qui utilisent des modèles obsolètes, pas les enfants qui sont problématiques." },
          { q: "Une grande règle selon Ausloos est négociable et sujette à exceptions selon le contexte.", answer: false, exp: "Faux. C'est la petite règle qui est négociable. La grande règle est nécessaire à la survie, ne peut être transgressée sous aucun prétexte et ne nécessite aucune justification." },
        ]
      }
    ]
  }
];

const AUTHORS = [
  { name: "Bateson", role: "École de Palo Alto, cybernétique, communication" },
  { name: "Von Bertalanffy", role: "Théorie générale des systèmes, homéostasie" },
  { name: "Minuchin", role: "Familles désengagées/enchevêtrées, frontières" },
  { name: "Ausloos", role: "Compétences, transactions rigides/chaotiques, grandes/petites règles, sélection/amplification" },
  { name: "Andolfi", role: "Enfant ressource, thérapies de couple camouflées, modèle tri-générationnel" },
  { name: "Bowen", role: "Triangle relationnel, différenciation, rupture émotionnelle, enfant chronique" },
  { name: "Selvini (École de Milan)", role: "Hypothétisation, circularité, neutralité, miroir sans tain" },
  { name: "Neuburger", role: "Allégation / souffrance / symptôme, analyse de la demande" },
  { name: "Haxhe", role: "Fratrie, parentification, rivalité fraternelle" },
  { name: "Mazzoni", role: "Parentification, adultalisation, maritalisation" },
  { name: "Bujold", role: "Trait / trouble / maladie" },
  { name: "Gaillard", role: "Enfants mutants, mutation psycho-sociétale" },
];

function App() {
  const [activeChapter, setActiveChapter] = useState(null);
  const [activeSection, setActiveSection] = useState(0);
  const [showAuthors, setShowAuthors] = useState(false);
  const [tab, setTab] = useState("cours");
  const [quizAnswers, setQuizAnswers] = useState({});
  const [quizRevealed, setQuizRevealed] = useState({});

  const bg = "#080c14";
  const cardBg = "#0e1420";
  const borderCol = "#1e2a3a";
  const textMain = "#e8edf5";
  const textSub = "#6b7f96";

  const ch = activeChapter !== null ? chapters[activeChapter] : null;

  const handleAnswer = (chIdx, sIdx, qIdx, val) => {
    const key = `${chIdx}-${sIdx}-${qIdx}`;
    if (quizRevealed[key]) return;
    setQuizAnswers(prev => ({ ...prev, [key]: val }));
    setQuizRevealed(prev => ({ ...prev, [key]: true }));
  };

  const getScore = (chIdx, sIdx) => {
    const qs = chapters[chIdx].sections[sIdx].quiz;
    let correct = 0, answered = 0;
    qs.forEach((q, qIdx) => {
      const key = `${chIdx}-${sIdx}-${qIdx}`;
      if (quizRevealed[key]) { answered++; if (quizAnswers[key] === q.answer) correct++; }
    });
    return { correct, answered, total: qs.length };
  };

  return (
    <div style={{ minHeight: "100vh", background: bg, fontFamily: "'Georgia','Times New Roman',serif", color: textMain, overflowX: "hidden" }}>
      <div style={{ borderBottom: `1px solid ${borderCol}`, padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, background: `${bg}ee`, backdropFilter: "blur(12px)", zIndex: 100 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {activeChapter !== null && (
            <button onClick={() => { setActiveChapter(null); setActiveSection(0); setTab("cours"); }} style={{ background: "none", border: "none", color: textSub, cursor: "pointer", fontSize: 20, padding: "2px 8px" }}>←</button>
          )}
          <div>
            <div style={{ fontSize: 10, letterSpacing: 3, color: textSub, textTransform: "uppercase" }}>{activeChapter !== null ? `Chapitre ${ch.id}` : "Résumé complet"}</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: textMain }}>{activeChapter !== null ? ch.title : "Psychopathologie Systémique"}</div>
          </div>
        </div>
        <button onClick={() => { setShowAuthors(!showAuthors); setActiveChapter(null); }}
          style={{ background: showAuthors ? "#1e2a3a" : "none", border: `1px solid ${showAuthors ? "#38bdf8" : borderCol}`, color: showAuthors ? "#38bdf8" : textSub, borderRadius: 10, padding: "7px 14px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>
          👥 Auteurs
        </button>
      </div>

      {showAuthors && (
        <div style={{ padding: "24px", maxWidth: 860, margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: 3, color: textSub, textTransform: "uppercase", marginBottom: 18 }}>Auteurs à connaître pour l'examen</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 10 }}>
            {AUTHORS.map((a, i) => (
              <div key={i} style={{ background: cardBg, border: `1px solid ${borderCol}`, borderRadius: 12, padding: "14px 18px" }}>
                <div style={{ fontWeight: 700, color: "#38bdf8", fontSize: 14, marginBottom: 5 }}>{a.name}</div>
                <div style={{ color: textSub, fontSize: 13, lineHeight: 1.5 }}>{a.role}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {!showAuthors && activeChapter === null && (
        <div style={{ padding: "28px 24px", maxWidth: 860, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 36 }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: textMain }}>Résumé complet du cours</div>
            <div style={{ color: textSub, marginTop: 6, fontSize: 14 }}>5 chapitres · Cours + Quiz V/F par section</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {chapters.map((c, i) => (
              <button key={i} onClick={() => { setActiveChapter(i); setActiveSection(0); setTab("cours"); setShowAuthors(false); }}
                style={{ background: cardBg, border: `1px solid ${borderCol}`, borderRadius: 16, padding: "20px 24px", cursor: "pointer", display: "flex", alignItems: "center", gap: 18, textAlign: "left", width: "100%" }}>
                <div style={{ width: 48, height: 48, borderRadius: 12, background: c.color + "20", border: `1px solid ${c.color}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0 }}>{c.icon}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 10, color: c.color, letterSpacing: 2, textTransform: "uppercase", marginBottom: 3 }}>Chapitre {c.id} · {c.sections.length} sections</div>
                  <div style={{ fontSize: 17, fontWeight: 700, color: textMain }}>{c.title}</div>
                  <div style={{ fontSize: 13, color: textSub, marginTop: 2 }}>{c.subtitle}</div>
                </div>
                <div style={{ color: textSub }}>→</div>
              </button>
            ))}
          </div>
          <div style={{ marginTop: 24, background: cardBg, border: `1px solid ${borderCol}`, borderRadius: 16, padding: "22px 24px" }}>
            <div style={{ fontSize: 11, letterSpacing: 3, color: textSub, textTransform: "uppercase", marginBottom: 14 }}>⚡ À retenir absolument</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 8 }}>
              {["Causalité circulaire A↔B (≠ linéaire)", "Homéostasie : le symptôme maintient l'équilibre", "Patient désigné ≠ celui qui souffre le plus", "Seconde cybernétique : thérapeute IN le système", "Postulat Ausloos : la famille résout ses propres problèmes", "Triangle de Bowen : plus petite unité stable", "Parentification : enfant met ses besoins entre parenthèses", "Rupture émotionnelle : coupure apparente, lien toujours là"].map((item, i) => (
                <div key={i} style={{ background: "#0a0f1a", border: `1px solid ${borderCol}`, borderRadius: 8, padding: "9px 12px", fontSize: 12, color: textMain, lineHeight: 1.5 }}>
                  <span style={{ color: "#f472b6", marginRight: 5 }}>→</span>{item}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {!showAuthors && activeChapter !== null && (
        <div style={{ padding: "20px 24px", maxWidth: 860, margin: "0 auto" }}>
          <div style={{ display: "flex", gap: 7, marginBottom: 22, flexWrap: "wrap" }}>
            {ch.sections.map((s, i) => {
              const sc = getScore(activeChapter, i);
              return (
                <button key={i} onClick={() => { setActiveSection(i); setTab("cours"); }}
                  style={{ background: activeSection === i ? ch.color + "22" : "none", border: `1px solid ${activeSection === i ? ch.color : borderCol}`, color: activeSection === i ? ch.color : textSub, borderRadius: 9, padding: "7px 13px", fontSize: 12, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 6 }}>
                  {i + 1}. {s.title}
                  {sc.answered > 0 && <span style={{ fontSize: 10, background: sc.correct === sc.total ? "#34d39930" : "#fb923c30", color: sc.correct === sc.total ? "#34d399" : "#fb923c", borderRadius: 4, padding: "1px 5px" }}>{sc.correct}/{sc.total}</span>}
                </button>
              );
            })}
          </div>

          {ch.sections.map((s, sIdx) => (
            <div key={sIdx} style={{ display: activeSection === sIdx ? "block" : "none" }}>
              <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
                {["cours", "quiz"].map(t => (
                  <button key={t} onClick={() => setTab(t)}
                    style={{ background: tab === t ? ch.color + "22" : "none", border: `1px solid ${tab === t ? ch.color : borderCol}`, color: tab === t ? ch.color : textSub, borderRadius: 9, padding: "7px 18px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: tab === t ? 700 : 400 }}>
                    {t === "cours" ? "📖 Cours" : "✏️ Quiz V/F"}
                  </button>
                ))}
              </div>

              {tab === "cours" && (
                <>
                  <div style={{ background: cardBg, border: `1px solid ${borderCol}`, borderRadius: 18, padding: "28px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, paddingBottom: 16, borderBottom: `1px solid ${borderCol}` }}>
                      <div style={{ width: 32, height: 32, borderRadius: 8, background: ch.color + "20", border: `1px solid ${ch.color}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{ch.icon}</div>
                      <div>
                        <div style={{ fontSize: 10, color: ch.color, letterSpacing: 2, textTransform: "uppercase" }}>Section {sIdx + 1}</div>
                        <div style={{ fontSize: 18, fontWeight: 700, color: textMain }}>{s.title}</div>
                      </div>
                    </div>
                    <div style={{ fontSize: 14, color: textMain, lineHeight: 1.9, whiteSpace: "pre-line" }}>{s.content}</div>
                  </div>
                  <div style={{ background: ch.color + "12", border: `1px solid ${ch.color}44`, borderRadius: 12, padding: "14px 18px", marginTop: 14, display: "flex", gap: 10, alignItems: "flex-start" }}>
                    <div style={{ fontSize: 16 }}>💡</div>
                    <div>
                      <div style={{ fontSize: 10, color: ch.color, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4 }}>Point clé</div>
                      <div style={{ fontSize: 13, color: textMain, lineHeight: 1.6 }}>{s.key}</div>
                    </div>
                  </div>
                  <button onClick={() => setTab("quiz")} style={{ marginTop: 14, width: "100%", background: ch.color + "18", border: `1px solid ${ch.color}66`, color: ch.color, borderRadius: 12, padding: "13px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
                    ✏️ S'exercer sur cette section →
                  </button>
                </>
              )}

              {tab === "quiz" && (
                <>
                  <div style={{ fontSize: 11, letterSpacing: 3, color: textSub, textTransform: "uppercase", marginBottom: 16 }}>Vrai ou Faux · {s.title}</div>
                  {s.quiz.map((q, qIdx) => {
                    const key = `${activeChapter}-${sIdx}-${qIdx}`;
                    const selected = quizAnswers[key];
                    const revealed = quizRevealed[key];
                    const isCorrect = selected === q.answer;
                    return (
                      <div key={qIdx} style={{ background: cardBg, border: `1px solid ${revealed ? (isCorrect ? "#34d39944" : "#fb923c44") : borderCol}`, borderRadius: 16, padding: "20px", marginBottom: 12 }}>
                        <div style={{ fontSize: 11, color: textSub, marginBottom: 8 }}>Question {qIdx + 1} / {s.quiz.length}</div>
                        <div style={{ fontSize: 15, color: textMain, lineHeight: 1.7, marginBottom: 16, fontWeight: 600 }}>{q.q}</div>
                        <div style={{ display: "flex", gap: 10 }}>
                          {[true, false].map(val => {
                            const label = val ? "VRAI" : "FAUX";
                            let bg2 = "#0a0f1a", border2 = borderCol, col2 = textSub;
                            if (revealed) {
                              if (val === q.answer) { bg2 = "#34d39918"; border2 = "#34d399"; col2 = "#34d399"; }
                              else if (val === selected && !isCorrect) { bg2 = "#fb923c18"; border2 = "#fb923c"; col2 = "#fb923c"; }
                            } else if (selected === val) { bg2 = ch.color + "18"; border2 = ch.color; col2 = ch.color; }
                            return (
                              <button key={String(val)} onClick={() => handleAnswer(activeChapter, sIdx, qIdx, val)} disabled={revealed}
                                style={{ flex: 1, background: bg2, border: `1px solid ${border2}`, borderRadius: 10, padding: "13px 0", color: col2, fontSize: 15, fontFamily: "inherit", fontWeight: 700, letterSpacing: 2, cursor: revealed ? "default" : "pointer" }}>
                                {label}
                              </button>
                            );
                          })}
                        </div>
                        {revealed && (
                          <div style={{ marginTop: 12, padding: "12px 14px", background: isCorrect ? "#34d39910" : "#fb923c10", borderRadius: 10, borderLeft: `3px solid ${isCorrect ? "#34d399" : "#fb923c"}` }}>
                            <div style={{ fontSize: 11, fontWeight: 700, color: isCorrect ? "#34d399" : "#fb923c", letterSpacing: 1, marginBottom: 4 }}>{isCorrect ? "✓ CORRECT" : "✗ INCORRECT"}</div>
                            <div style={{ fontSize: 13, color: textMain, lineHeight: 1.6 }}>{q.exp}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {(() => {
                    const sc = getScore(activeChapter, sIdx);
                    if (sc.answered < sc.total) return null;
                    const color = sc.correct === sc.total ? "#34d399" : sc.correct >= 2 ? "#fbbf24" : "#fb923c";
                    return (
                      <div style={{ background: color + "12", border: `1px solid ${color}44`, borderRadius: 12, padding: "16px", textAlign: "center", marginTop: 4 }}>
                        <div style={{ fontSize: 24, fontWeight: 700, color }}>{sc.correct}/{sc.total}</div>
                        <div style={{ fontSize: 13, color: textSub, marginTop: 4 }}>{sc.correct === sc.total ? "Parfait ! 🎉" : sc.correct >= 2 ? "Bien joué !" : "Relis le cours 📖"}</div>
                      </div>
                    );
                  })()}
                  <button onClick={() => setTab("cours")} style={{ width: "100%", background: "none", border: `1px solid ${borderCol}`, color: textSub, borderRadius: 12, padding: "11px", fontSize: 12, cursor: "pointer", fontFamily: "inherit", marginTop: 10 }}>
                    📖 Retour au cours
                  </button>
                </>
              )}
            </div>
          ))}

          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18 }}>
            <button onClick={() => { setActiveSection(Math.max(0, activeSection - 1)); setTab("cours"); }} disabled={activeSection === 0}
              style={{ background: "none", border: `1px solid ${borderCol}`, color: activeSection === 0 ? "#2a3444" : textSub, borderRadius: 10, padding: "9px 18px", fontSize: 13, cursor: activeSection === 0 ? "default" : "pointer", fontFamily: "inherit" }}>← Précédent</button>
            {activeSection < ch.sections.length - 1 ? (
              <button onClick={() => { setActiveSection(activeSection + 1); setTab("cours"); }}
                style={{ background: ch.color + "22", border: `1px solid ${ch.color}66`, color: ch.color, borderRadius: 10, padding: "9px 18px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>Suivant →</button>
            ) : (
              <button onClick={() => { if (activeChapter < chapters.length - 1) { setActiveChapter(activeChapter + 1); setActiveSection(0); setTab("cours"); } else { setActiveChapter(null); } }}
                style={{ background: ch.color + "22", border: `1px solid ${ch.color}66`, color: ch.color, borderRadius: 10, padding: "9px 18px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
                {activeChapter < chapters.length - 1 ? `Chapitre ${activeChapter + 2} →` : "✓ Terminé"}
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
